name: nullpass
description: NullPass is a locally managed password manager
publish_to: none

version: 0.0.1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  barcode_scan2: ^4.3.3
  cached_network_image: ^3.4.1
  flutter_app_lock: ^3.0.0
  flutter_secure_storage: ^9.2.2
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.2.1
  local_auth: ^2.3.0
  material_design_icons_flutter: ^7.0.7296
  onesignal_flutter: ^5.2.5
  openpgp: ^3.10.7
  otp: ^3.1.4
  path_provider: ^2.1.4
  qr_flutter: ^4.1.0
  # Temporarily disabled due to missing namespace in Android build.gradle
  # TODO: Re-enable after updating plugin to support AGP 8.1+
  # secure_screen_switcher:
  #   git:
  #     url: https://github.com/pseudorand-dev/secure_screen_switcher.git
  #     ref: main
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3
  # Temporarily disabled due to hashValues compatibility issue with Dart 3.x
  # TODO: Find alternative or update to compatible version
  # timeline_list: ^0.0.6
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  validators: ^3.0.0
  vibration: ^2.0.0
  visibility_detector: ^0.4.0+2

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^4.0.0

flutter_icons:
  ios: true
  android: true
  image_path_ios: "assets/images/null_iosScaledDown_1500_Transparent.png"
  image_path_android: "assets/images/null_iosScaledDown_1500_Transparent.png"


flutter:
  assets:
    - assets/images/
  uses-material-design: true
